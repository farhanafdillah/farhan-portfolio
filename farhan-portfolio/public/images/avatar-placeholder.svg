<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <!-- Body silhouette -->
  <ellipse cx="200" cy="390" rx="120" ry="60" fill="#06b6d4" opacity="0.5"/>
  <!-- Head -->
  <circle cx="200" cy="155" r="75" fill="#06b6d4" opacity="0.75"/>
  <!-- Inner circle highlight -->
  <circle cx="185" cy="140" r="25" fill="white" opacity="0.08"/>
  <!-- Initials text -->
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">FB</text>
  <!-- Bottom label -->
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Farhan Bayna Afdillah</text>
  <text x="200" y="335" font-family="Arial, sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">Mahasiswa Informatika</text>
</svg>
