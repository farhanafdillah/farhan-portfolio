<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <!-- Router center -->
  <rect x="340" y="160" width="120" height="80" rx="10" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
  <text x="400" y="197" font-family="Arial" font-size="11" fill="#06b6d4" text-anchor="middle" font-weight="bold">ROUTER</text>
  <text x="400" y="212" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">Cisco</text>
  <!-- Left node 1 -->
  <rect x="80" y="100" width="90" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="127" font-family="Arial" font-size="10" fill="#3b82f6" text-anchor="middle">PC 1</text>
  <text x="125" y="142" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">192.168.1.x</text>
  <!-- Left node 2 -->
  <rect x="80" y="230" width="90" height="60" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="257" font-family="Arial" font-size="10" fill="#3b82f6" text-anchor="middle">PC 2</text>
  <text x="125" y="272" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">192.168.1.x</text>
  <!-- Right node 1 -->
  <rect x="630" y="100" width="90" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="675" y="127" font-family="Arial" font-size="10" fill="#8b5cf6" text-anchor="middle">Server</text>
  <text x="675" y="142" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">10.0.0.x</text>
  <!-- Right node 2 -->
  <rect x="630" y="230" width="90" height="60" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="675" y="257" font-family="Arial" font-size="10" fill="#8b5cf6" text-anchor="middle">Mikrotik</text>
  <text x="675" y="272" font-family="Arial" font-size="9" fill="#64748b" text-anchor="middle">Firewall</text>
  <!-- Connections -->
  <line x1="170" y1="130" x2="340" y2="185" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <line x1="170" y1="260" x2="340" y2="215" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <line x1="460" y1="185" x2="630" y2="130" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <line x1="460" y1="215" x2="630" y2="260" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>
  <!-- Label -->
  <rect x="200" y="345" width="400" height="30" rx="6" fill="#06b6d4" opacity="0.1"/>
  <text x="400" y="365" font-family="Arial" font-size="14" fill="#06b6d4" text-anchor="middle" font-weight="bold">Network Topology &amp; Security Design</text>
</svg>
